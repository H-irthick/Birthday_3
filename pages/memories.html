    <script>
      // Theme persistence + system preference
      (function() {
        const root = document.documentElement;
        const stored = localStorage.getItem('theme');
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initial = stored || (systemDark ? 'dark' : 'light');
        if (initial === 'dark') root.setAttribute('data-theme', 'dark');
        const btn = document.getElementById('toggleTheme');
        btn?.addEventListener('click', () => {
          const isDark = root.getAttribute('data-theme') === 'dark';
          if (isDark) {
            root.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
          } else {
            root.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
          }
        });
      })();

      // Build DNA rows dynamically
      const dnaEl = document.getElementById('dna');
      if (dnaEl) {
        const rows = 26; // adjust density
        for (let i = 0; i < rows; i++) {
          const row = document.createElement('div');
          row.className = 'dna-row';
          row.style.setProperty('--i', String(i));

          const dotA = document.createElement('span');
          dotA.className = 'dna-dot a';
          dotA.style.setProperty('--i', String(i));
          const dotB = document.createElement('span');
          dotB.className = 'dna-dot b';
          dotB.style.setProperty('--i', String(i));

          const rail = document.createElement('span');
          rail.className = 'dna-rail';
          rail.style.setProperty('--i', String(i));

          row.appendChild(dotA);
          row.appendChild(rail);
          row.appendChild(dotB);
          dnaEl.appendChild(row);
        }
      }
      // IntersectionObserver to toggle is-active class for zoom effect
      const slides = Array.from(document.querySelectorAll('.slide'));
      const dots = Array.from(document.querySelectorAll('.dot'));
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            slides.forEach((s) => s.classList.remove('is-active'));
            entry.target.classList.add('is-active');
            const index = slides.indexOf(entry.target);
            dots.forEach((d) => d.classList.remove('active'));
            if (index >= 0) dots[index].classList.add('active');

            // Update DNA gradient colors per active slide
            const palette = [
              ['#f5afc2', '#c7b8ea'], // 1
              ['#ffd3a3', '#a9e7da'], // 2
              ['#a8d0ff', '#ffb3c1'], // 3
              ['#d0b3ff', '#ffdfb0'], // 4
              ['#ffb3c1', '#a8d0ff'], // 5
              ['#a9e7da', '#ffd3a3'], // 6
              ['#c7b8ea', '#f5afc2'], // 7
              ['#ffdfb0', '#d0b3ff'], // 8
            ];
            const [a, b] = palette[index % palette.length];
            document.documentElement.style.setProperty('--dna-a', a);
            document.documentElement.style.setProperty('--dna-b', b);
          }
        });
      }, { threshold: 0.6 });

      slides.forEach((slide) => observer.observe(slide));

      // Dot navigation
      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => {
          slides[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      // Ensure first slide marked active on load
      window.addEventListener('load', () => {
        slides[0]?.classList.add('is-active');
        dots[0]?.classList.add('active');
        // Initialize DNA colors for first slide
        document.documentElement.style.setProperty('--dna-a', '#f5afc2');
        document.documentElement.style.setProperty('--dna-b', '#c7b8ea');
      });
    </script>
